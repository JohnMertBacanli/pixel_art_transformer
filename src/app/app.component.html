<div class="downscaler-container">
  <h2>Pixel Art Downscaler</h2>

  <div class="controls">
    <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    
    <label for="subdivision">Subdivision Factor:</label>
    <input 
      id="subdivision" 
      type="number" 
      [value]="subdivisionLevel" 
      (input)="onSubdivisionChange($event)"
      min="0.1" 
      step="0.5" 
    />

    <button (click)="processImage()">Downscale</button>
  </div>

  <div class="canvas-wrapper">
    <canvas #displayCanvas></canvas>
  </div>
</div>
